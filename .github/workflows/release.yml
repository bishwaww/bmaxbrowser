name: Release

# Every push to main becomes a new published Windows version: this workflow builds the installer, uploads it with
# latest.yml to a GitHub release and publishes it. Installed copies of BMAX find it there (Update button in the toolbar,
# Menu -> Check for updates).
#
# - The version is MAJOR.MINOR from package.json plus the next free patch number (scripts/next-version.mjs).
# - Pushes that only touch docs or tests do not release. Put [skip ci] in a commit message to skip a release on purpose.
# - The repository must be PUBLIC for installed copies to see the releases (they check without any account or token).
# - macOS / Linux packages are not built here (no pinned binaries for them yet); see docs/PACKAGING.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A release that carries a version tag but no latest.yml cannot serve updates: it is a leftover of a failed or
      # half-finished run (electron-builder's own uploader used to split one version over two draft releases). Remove those,
      # and their tags, so the version number is free again. Releases with a latest.yml are never touched.
      - name: Remove unusable releases left by earlier runs
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | select(.draft or ([.assets[].name] | index("latest.yml") | not)) | "\(.id) \(.tag_name) \(.draft)"' | tr -d '\r' | while read -r id tag draft; do
            echo "Deleting release $tag (id $id, draft=$draft)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            if [ "$draft" = "false" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true; fi
          done

      - name: Pick the version
        id: version
        shell: bash
        run: node scripts/next-version.mjs >> "$GITHUB_OUTPUT"
      - name: Set the version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - run: npm run typecheck
      - run: npm test

      # Tor, yt-dlp and ffmpeg are not in git: download them from their official sources and refuse anything whose
      # SHA-256 differs from the value pinned in resources/bin/CHECKSUMS.md.
      - name: Fetch and verify bundled binaries
        run: node scripts/fetch-binaries.mjs
      - run: node scripts/verify-binaries.mjs --strict

      - run: npm run build
      # electron-builder only builds here. Its own uploader is not used: it put the files of one version into two
      # separate draft releases, so the published one was missing the installer or latest.yml.
      - name: Package
        run: npx electron-builder --win --publish never
        env:
          # Code signing (optional, see docs/PACKAGING.md). Unsigned builds are produced when these are empty.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # gh uploads every file to a draft and publishes it only when all of them are there, so nobody is offered a
      # half-uploaded update. latest.yml is what installed copies read; the .blockmap allows smaller update downloads.
      - name: Publish the release
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          ls -l dist
          test -s dist/latest.yml
          grep -q "version: $v" dist/latest.yml
          gh release create "v$v" \
            "dist/BMAX-Browser-Setup-$v-x64.exe" \
            "dist/BMAX-Browser-Setup-$v-x64.exe.blockmap" \
            "dist/BMAX-Browser-Portable-$v-x64.exe" \
            dist/latest.yml \
            --title "BMAX Browser $v" --notes "Automatic build of commit ${GITHUB_SHA::7}." --target "$GITHUB_SHA" --latest
          # Fail loudly if the published release is not complete.
          gh release view "v$v" --json assets --jq '[.assets[].name] | join(" ")' | tee assets.txt
          grep -q "latest.yml" assets.txt
          grep -q "BMAX-Browser-Setup-$v-x64.exe " assets.txt || grep -q "BMAX-Browser-Setup-$v-x64.exe$" assets.txt
